# Eve Manifest - v2 Compose Specification
# Defines services, environments, and deployment pipelines

schema: eve/compose/v2
project: fullstack-example

x-eve:
  agents:
    version: 1
    config_path: ./agents/agents.yaml
    teams_path: ./agents/teams.yaml
    profiles:
      primary-orchestrator:
        - harness: zai
          model: glm-4.7
          reasoning_effort: high
      primary-reviewer:
        - harness: zai
          model: glm-4.7
          reasoning_effort: medium
  chat:
    config_path: ./agents/chat.yaml
  packs:
    - source: ./packs/notes-ops
    - source: eve-horizon/eve-software-factory
      ref: 72ed321b9dee7ae497e7ff60486aa2e8657d365f

# Optional: Override cluster's default domain for Ingress routing
# If not set, uses EVE_DEFAULT_DOMAIN from the cluster config
# domain: custom.example.com

# Use Eve-native registry (auth handled internally via EVE_INTERNAL_API_KEY + JWT)
registry: "eve"

# Services to build and deploy
services:
  api:
    build:
      context: ./apps/api
      dockerfile: ./apps/api/Dockerfile
    ports: [3000]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${managed.db.roles.app.url}   # a declared role; the owner URL is for job services
      EVE_JWKS_URL: ${EVE_JWKS_URL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    x-eve:
      ingress:
        public: false                     # private: the web service proxies /api/ to it
      api_spec:
        type: openapi
        spec_url: /openapi.json
      object_store:
        buckets:
          - name: uploads
            visibility: private
          - name: assets
            visibility: public

  web:
    build:
      context: ./apps/web
      dockerfile: ./apps/web/Dockerfile
    ports: [80]
    environment:
      API_SERVICE_HOST: ${ENV_NAME}-api
    depends_on:
      api:
        condition: service_healthy
    x-eve:
      ingress:
        public: true
        port: 80
      security:                           # stock nginx starts as root to bind port 80, then
        run_as_root: true                 # drops to its worker user; the strict profile needs
        capabilities: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID]   # this opt-out for it

  migrate:
    image: ghcr.io/eve-horizon/eve-horizon/migrate:0.1.332   # runs as USER 1000:1000
    environment:
      DATABASE_URL: ${managed.db.url}     # the owner URL: allowed in job services
    x-eve:
      role: job
      files:
        - source: db/migrations
          target: /migrations

  db:
    x-eve:
      role: managed_db
      managed:
        class: db.p1
        engine: postgres
        engine_version: "16"
        roles:
          - name: app
            grants: readwrite

# Deployment environments
environments:
  test:
    pipeline: deploy-test
  staging:
    pipeline: deploy-staging
  production:
    pipeline: deploy-production

# Deterministic pipelines
pipelines:
  migrate:
    steps:
      - name: run-migration
        action:
          type: job
          service: migrate

  deploy-test:
    steps:
      - name: build
        action: { type: build }
      - name: release
        depends_on: [build]
        action: { type: release }
      - name: deploy
        depends_on: [release]
        action: { type: deploy }
      - name: migrate
        depends_on: [deploy]
        action:
          type: job
          service: migrate
      - name: smoke-test
        depends_on: [migrate]
        script:
          run: ./scripts/smoke-test.sh
          timeout: 300

  deploy-staging:
    steps:
      - name: build
        action: { type: build }
      - name: release
        depends_on: [build]
        action: { type: release }
      - name: deploy
        depends_on: [release]
        action: { type: deploy }
      - name: migrate
        depends_on: [deploy]
        action:
          type: job
          service: migrate

  deploy-production:
    steps:
      - name: build
        action: { type: build }
      - name: release
        depends_on: [build]
        action: { type: release }
      - name: deploy
        depends_on: [release]
        action: { type: deploy }
      - name: migrate
        depends_on: [deploy]
        action:
          type: job
          service: migrate

  # Event-driven CI/CD pipelines
  ci-main:
    trigger:
      github:
        event: push
        branch: main
    steps:
      - name: build
        script:
          run: npm run build
      - name: test
        depends_on: [build]
        script:
          run: npm test

  ci-feature:
    trigger:
      github:
        event: push
        branch: feature/*
    steps:
      - name: lint
        script:
          run: npm run lint
      - name: test
        script:
          run: npm test

  remediation:
    trigger:
      system:
        event: job.failed
    steps:
      - name: analyze
        agent:
          prompt: "Analyze failure and propose a fix"
      - name: create-pr
        depends_on: [analyze]
        action:
          type: create-pr
          head: remediation/example
          base: main
          title: "Remediation"
          dry_run: true

# Workflows - Manual and scheduled operations
workflows:
  db-backup:
    manual: true
    db_access: read_only
    steps:
      - name: backup
        script:
          run: ./scripts/backup-db.sh
